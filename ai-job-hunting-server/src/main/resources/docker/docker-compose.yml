services:
  ai-job:
    image: "${AI_JOB_IMAGE:-ai-job:1.0}"
    restart: unless-stopped
    init: true
    # A host reverse proxy terminates HTTPS; do not expose the configuration console.
    ports:
      - "127.0.0.1:${AI_JOB_HTTP_PORT:-9100}:9100"
    volumes:
      - type: bind
        source: "${AI_JOB_CONFIG_FILE:?Set the absolute path to production application.properties}"
        target: /app/config/application.properties
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: "${AI_JOB_MEMORY_LIMIT:-2g}"
    pids_limit: 512
    stop_grace_period: 30s
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0"
      DB_URL: "${DB_URL:?Set the production PostgreSQL JDBC URL}"
      DB_USERNAME: "${DB_USERNAME:?Set the PostgreSQL username}"
      DB_PASSWORD: "${DB_PASSWORD:?Set the PostgreSQL password}"
      SMART_ADMIN_USERNAME: "${SMART_ADMIN_USERNAME:-admin}"
      SMART_ADMIN_PASSWORD: "${SMART_ADMIN_PASSWORD:?Set a strong SmartConfig password}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

